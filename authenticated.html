<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account — PARAGOS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/pages.css">
</head>

<body>

<!-- AUTHENTICATED NAVBAR -->
<nav class="navbar" id="siteNav" aria-label="Main navigation"></nav>


<!-- ACCOUNT PAGE -->
<main style="padding:70px 5vw; min-height:70vh;">

  <section style="max-width:1000px; margin:auto;">

    <div class="eyebrow">MY ACCOUNT</div>

    <h1>
      Welcome back,
      <span id="userName"></span>!
    </h1>

    <p class="sub">
      Manage your PARAGOS account, bookings and travel information.
    </p>


    <!-- ACCOUNT INFORMATION -->
    <div class="auth-card" style="margin-top:32px;">

      <h2>Account Information</h2>

      <div style="
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:22px;
        margin-top:22px;
      ">

        <div>
          <label>Full Name</label>
          <div id="accountName" style="margin-top:7px;font-weight:600;"></div>
        </div>

        <div>
          <label>Email Address</label>
          <div id="accountEmail" style="margin-top:7px;font-weight:600;"></div>
        </div>

        <div>
          <label>Account Status</label>
          <div style="color:#0E6E66;font-weight:600;margin-top:7px;">
            ✓ Authenticated
          </div>
        </div>

      </div>

      <div style="
        display:flex;
        gap:14px;
        flex-wrap:wrap;
        margin-top:30px;
      ">

        <a href="booking.html" class="btn btn-primary">
          Book a Trip
        </a>

        <a href="destinations.html" class="btn btn-ghost">
          Explore Destinations
        </a>

      </div>

    </div>


    <!-- BOOKINGS -->
    <div class="auth-card" style="margin-top:28px;">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;
      ">

        <div>
          <h2 style="margin-bottom:6px;">
            My Bookings
          </h2>

          <p class="sub" style="margin:0;">
            Your PARAGOS bookings saved on this device.
          </p>
        </div>

        <a href="booking.html" class="btn btn-primary">
          New Booking
        </a>

      </div>


      <div id="bookingList" style="margin-top:24px;">
        <div style="
          padding:24px;
          border:1px solid rgba(10,46,44,.12);
          border-radius:14px;
          text-align:center;
          color:#60716F;
        ">
          Loading bookings...
        </div>
      </div>

    </div>

  </section>

</main>


<footer>
  <div class="footer-bottom" style="justify-content:center;">
    © 2026 PARAGOS Travel. All rights reserved.
  </div>
</footer>


<!-- CENTRAL PARAGOS DATA -->
<script src="assets/data/destinations.js"></script>
<script src="assets/data/stays.js"></script>
<script src="assets/data/vehicles.js"></script>
<script src="assets/data/offers.js"></script>
<script src="assets/data/faqs.js"></script>
<script src="assets/data/policies.js"></script>

<script src="assets/main.js"></script>


<script>
(function(){

  /* -----------------------------------------
     AUTHENTICATION
  ----------------------------------------- */

  const session = requireAuth();

  if(!session){
    return;
  }


  /* -----------------------------------------
     ACCOUNT INFORMATION
  ----------------------------------------- */

  const userName = document.getElementById("userName");
  const accountName = document.getElementById("accountName");
  const accountEmail = document.getElementById("accountEmail");
  const navUser = document.getElementById("navUser");

  const displayName = session.name || "Traveler";
  const displayEmail = session.email || "";

  if(userName){
    userName.textContent = displayName;
  }

  if(accountName){
    accountName.textContent = displayName;
  }

  if(accountEmail){
    accountEmail.textContent = displayEmail;
  }

  if(navUser){
    navUser.textContent = displayName;
  }


  /* -----------------------------------------
     LOGOUT
  ----------------------------------------- */

  const logoutBtn = document.getElementById("logoutBtn");

  if(logoutBtn){

    logoutBtn.addEventListener("click", function(){

      if(window.PARAGOSAuth && typeof window.PARAGOSAuth.clearSession === "function"){

        window.PARAGOSAuth.clearSession();

      }else if(window.KatigAuth && typeof window.KatigAuth.clearSession === "function"){

        window.KatigAuth.clearSession();

      }

      window.location.href = "signin.html";

    });

  }


  /* -----------------------------------------
     DATA HELPERS
  ----------------------------------------- */

  const data = window.PARAGOS_DATA || {};

  const destinations = Array.isArray(data.destinations)
    ? data.destinations
    : [];

  const stays = Array.isArray(data.stays)
    ? data.stays
    : [];

  const vehicles = Array.isArray(data.vehicles)
    ? data.vehicles
    : [];


  function getDestination(id){

    if(!id){
      return null;
    }

    return destinations.find(function(item){

      return String(
        item.id ??
        item.code ??
        item.destinationId
      ) === String(id);

    }) || null;

  }


  function getStay(id){

    if(!id){
      return null;
    }

    return stays.find(function(item){

      return String(
        item.id ??
        item.stayId
      ) === String(id);

    }) || null;

  }


  function getVehicle(id){

    if(!id){
      return null;
    }

    return vehicles.find(function(item){

      return String(
        item.id ??
        item.vehicleId
      ) === String(id);

    }) || null;

  }


  function formatPHP(value){

    const amount = Number(value) || 0;

    return "₱" + amount.toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  }


  function escapeHTML(value){

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatDate(value){

    if(!value){
      return "—";
    }

    const date = new Date(value + "T00:00:00");

    if(Number.isNaN(date.getTime())){
      return value;
    }

    return date.toLocaleDateString("en-PH", {
      month: "short",
      day: "numeric",
      year: "numeric"
    });

  }


  /* -----------------------------------------
     GET CURRENT USER BOOKINGS
  ----------------------------------------- */

  function loadBookings(){

    let bookings = [];


    if(
      window.PARAGOS &&
      typeof window.PARAGOS.getUserBookings === "function"
    ){

      bookings = window.PARAGOS.getUserBookings(
        session.email
      );

    }else if(
      window.PARAGOSAuth &&
      typeof window.PARAGOSAuth.getUserBookings === "function"
    ){

      bookings = window.PARAGOSAuth.getUserBookings(
        session.email
      );

    }


    if(!Array.isArray(bookings)){
      bookings = [];
    }


    return bookings.sort(function(a,b){

      const first = new Date(
        a.createdAt || 0
      ).getTime();

      const second = new Date(
        b.createdAt || 0
      ).getTime();

      return second - first;

    });

  }


  /* -----------------------------------------
     BOOKING CARD
  ----------------------------------------- */

  function renderBooking(booking){

    /* bookings store destination/stay/vehicle as objects
       ({id, name, ...}) or, in older data, as plain ids */
    function refId(value){
      return value && typeof value === "object"
        ? value.id
        : value;
    }

    function refName(value){
      return value && typeof value === "object"
        ? value.name
        : "";
    }

    const destination =
      getDestination(
        booking.destinationId ||
        refId(booking.destination)
      );

    const stay =
      getStay(
        booking.stayId ||
        refId(booking.stay)
      );

    const vehicle =
      getVehicle(
        booking.vehicleId ||
        refId(booking.vehicle)
      );


    const destinationName =
      booking.destinationName ||
      refName(booking.destination) ||
      destination?.name ||
      (typeof booking.destination === "string" ? booking.destination : "") ||
      "Philippines";


    const destinationCode =
      booking.destinationCode ||
      (booking.destination && booking.destination.code) ||
      destination?.code ||
      "";


    const stayName =
      booking.stayName ||
      refName(booking.stay) ||
      stay?.name ||
      (typeof booking.stay === "string" ? booking.stay : "") ||
      "No stay selected";


    const vehicleName =
      booking.vehicleName ||
      refName(booking.vehicle) ||
      vehicle?.name ||
      (typeof booking.vehicle === "string" ? booking.vehicle : "") ||
      "No rental";


    const travelers =
      Number(
        booking.travelers ??
        booking.guests ??
        1
      ) || 1;


    const total =
      Number(
        booking.total ??
        booking.pricing?.total ??
        booking.amount ??
        0
      ) || 0;


    const reference =
      booking.reference ||
      booking.referenceNumber ||
      booking.id ||
      "PARAGOS";


    const status =
      booking.status ||
      "confirmed";


    const statusText =
      String(status)
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, function(letter){
          return letter.toUpperCase();
        });


    return `
      <article style="
        border:1px solid rgba(10,46,44,.12);
        border-radius:16px;
        padding:22px;
        margin-bottom:16px;
        background:#fff;
      ">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          gap:18px;
          flex-wrap:wrap;
        ">

          <div>

            <div style="
              font-family:'IBM Plex Mono',monospace;
              font-size:.78rem;
              letter-spacing:.06em;
              color:#60716F;
              margin-bottom:6px;
            ">
              ${escapeHTML(reference)}
            </div>

            <h3 style="margin:0 0 5px;">
              ${escapeHTML(destinationName)}
              ${destinationCode
                ? `<span style="
                    font-family:'IBM Plex Mono',monospace;
                    font-size:.72rem;
                    color:#60716F;
                    margin-left:7px;
                  ">${escapeHTML(destinationCode)}</span>`
                : ""
              }
            </h3>

            <div style="
              color:#60716F;
              font-size:.92rem;
            ">
              ${escapeHTML(formatDate(booking.checkin || booking.startDate))}
              →
              ${escapeHTML(formatDate(booking.checkout || booking.endDate))}
              ·
              ${travelers} traveler${travelers === 1 ? "" : "s"}
            </div>

          </div>


          <div style="
            display:inline-flex;
            align-items:center;
            padding:7px 11px;
            border-radius:999px;
            background:rgba(14,110,102,.09);
            color:#0E6E66;
            font-size:.82rem;
            font-weight:700;
            text-transform:capitalize;
          ">
            ${escapeHTML(statusText)}
          </div>

        </div>


        <div style="
          display:grid;
          grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
          gap:16px;
          margin-top:20px;
          padding-top:18px;
          border-top:1px solid rgba(10,46,44,.08);
        ">

          <div>
            <div style="
              font-size:.76rem;
              text-transform:uppercase;
              letter-spacing:.08em;
              color:#60716F;
            ">
              Stay
            </div>

            <div style="
              margin-top:5px;
              font-weight:600;
            ">
              ${escapeHTML(stayName)}
            </div>
          </div>


          <div>
            <div style="
              font-size:.76rem;
              text-transform:uppercase;
              letter-spacing:.08em;
              color:#60716F;
            ">
              Rental Car
            </div>

            <div style="
              margin-top:5px;
              font-weight:600;
            ">
              ${escapeHTML(vehicleName)}
            </div>
          </div>


          <div>
            <div style="
              font-size:.76rem;
              text-transform:uppercase;
              letter-spacing:.08em;
              color:#60716F;
            ">
              Total
            </div>

            <div style="
              margin-top:5px;
              font-weight:700;
              color:#0A2E2C;
            ">
              ${formatPHP(total)}
            </div>
          </div>

        </div>

      </article>
    `;

  }


  /* -----------------------------------------
     RENDER BOOKINGS
  ----------------------------------------- */

  function renderBookings(){

    const bookingList =
      document.getElementById("bookingList");

    if(!bookingList){
      return;
    }


    const bookings = loadBookings();


    if(!bookings.length){

      bookingList.innerHTML = `
        <div style="
          padding:32px 24px;
          border:1px dashed rgba(10,46,44,.18);
          border-radius:14px;
          text-align:center;
        ">

          <div style="
            font-size:2rem;
            margin-bottom:10px;
          ">
            ✈
          </div>

          <h3 style="margin-bottom:8px;">
            No bookings yet
          </h3>

          <p class="sub" style="
            margin:0 auto 20px;
            max-width:500px;
          ">
            Your confirmed PARAGOS trips will appear here after you complete a booking.
          </p>

          <a href="booking.html" class="btn btn-primary">
            Book Your First Trip
          </a>

        </div>
      `;

      return;

    }


    bookingList.innerHTML =
      bookings.map(renderBooking).join("");

  }


  renderBookings();


})();
</script>

</body>
</html>
